name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ matrix.node }}" }
      - run: npm ci
      - name: build, then all tests (conformance vectors, differential, memory)
        run: npm test

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24" }
      - run: npm ci
      - run: npm run build
      - name: every rule of the specification is covered
        run: npm run spectrace
      - name: known vulnerabilities in dependencies
        run: npm audit --audit-level=low
      - name: the package contents and a clean install
        run: |
          for pkg in core br zstd; do npm pack --dry-run -w packages/$pkg; npm pack -w packages/$pkg; done
          mkdir /tmp/consumer && cd /tmp/consumer && npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/spillgate-*.tgz
          node --input-type=module -e "import { decodeAll } from 'spillgate'; import { initBrotli } from 'spillgate-br'; import { codec } from 'spillgate-zstd'; import { gzipSync } from 'node:zlib'; await initBrotli(); codec(); const out = await decodeAll(gzipSync('pack ok'), 'gzip', { maxOutput: 100 }); console.log(Buffer.from(out).toString());"

  # The shipped WebAssembly decoder (packages/br/src/native) must be what its vendored sources build.
  # Two builds on this runner must agree (determinism), the second one from a copy at another path
  # (path remapping), and both must equal the committed files. See packages/br/rust/NOTES.md.
  brotli-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Exact pins: the committed binary was built with these versions.
      RUSTUP_TOOLCHAIN: "1.98.1"
      WASM_BINDGEN_VERSION: "0.2.114"
      EXPECTED_SHA256: "4a6f77a8563cf469bbb4db56ca746f54dcec92d665dc1593c0c38f2e73f03afe"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: rust 1.98.1 with the wasm32 target
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustc --version
          test "$(rustc --version | cut -d' ' -f2)" = "$RUSTUP_TOOLCHAIN"
      - name: wasm-bindgen-cli, exact version, locked dependencies
        run: |
          cargo install wasm-bindgen-cli --version "=$WASM_BINDGEN_VERSION" --locked
          test "$(wasm-bindgen --version | cut -d' ' -f2)" = "$WASM_BINDGEN_VERSION"
      - name: first build from the vendored sources (fresh target directory)
        run: bash packages/br/rust/build.sh "$RUNNER_TEMP/wasm-1"
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-1
      - name: second build from a copy at another path (fresh target directory)
        run: |
          mkdir -p "$RUNNER_TEMP/elsewhere/deeper"
          cp -r packages/br/rust "$RUNNER_TEMP/elsewhere/deeper/rust"
          bash "$RUNNER_TEMP/elsewhere/deeper/rust/build.sh" "$RUNNER_TEMP/wasm-2"
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-2
      - name: the two builds agree and equal the committed files
        run: |
          set -euo pipefail
          committed=packages/br/src/native
          h_committed=$(sha256sum "$committed/brotli_dec_wasm_bg.wasm" | cut -d' ' -f1)
          h1=$(sha256sum "$RUNNER_TEMP/wasm-1/brotli_dec_wasm_bg.wasm" | cut -d' ' -f1)
          h2=$(sha256sum "$RUNNER_TEMP/wasm-2/brotli_dec_wasm_bg.wasm" | cut -d' ' -f1)
          echo "committed $h_committed"
          echo "build 1   $h1"
          echo "build 2   $h2"
          if [ "$h_committed" != "$EXPECTED_SHA256" ]; then
            echo "::error::committed binary is $h_committed, NOTES.md says $EXPECTED_SHA256; update one of them on purpose"
            exit 1
          fi
          if [ "$h1" != "$h2" ]; then
            echo "::error::two builds of the same sources differ: the build is not deterministic on this runner"
            exit 1
          fi
          if [ "$h1" != "$h_committed" ]; then
            echo "::error::the rebuilt binary differs from the committed one. Fix: packages/br/rust/NOTES.md, section 'Reproducing the binary in CI'"
            exit 1
          fi
          if ! diff -r "$RUNNER_TEMP/wasm-1" "$committed"; then
            echo "::error::the glue or typings generated by wasm-bindgen differ from the committed files"
            exit 1
          fi
          echo "rebuilt binary and glue match the committed files"
      - name: keep the rebuilt files for a failed comparison (NOTES.md)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brotli-wasm-rebuilt-ubuntu
          path: ${{ runner.temp }}/wasm-1
          retention-days: 14
          if-no-files-found: warn
